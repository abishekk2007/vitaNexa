# ===== VITANEXA AI ENTERPRISE - KUBERNETES DEPLOYMENT =====

apiVersion: v1
kind: Namespace
metadata:
  name: vitanexa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitanexa-backend
  namespace: vitanexa
  labels:
    app: vitanexa
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vitanexa
      tier: backend
  template:
    metadata:
      labels:
        app: vitanexa
        tier: backend
    spec:
      containers:
      - name: backend
        image: vitanexa/backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vitanexa-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vitanexa-secrets
              key: jwt-secret
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: vitanexa-secrets
              key: jwt-refresh-secret
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: prisma-data
          mountPath: /app/prisma
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: vitanexa-uploads-pvc
      - name: prisma-data
        persistentVolumeClaim:
          claimName: vitanexa-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vitanexa-backend-service
  namespace: vitanexa
spec:
  selector:
    app: vitanexa
    tier: backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: vitanexa-frontend-service
  namespace: vitanexa
spec:
  selector:
    app: vitanexa
    tier: frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
---
# Redis for caching layer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vitanexa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: vitanexa
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
# Persistent Volumes
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vitanexa-uploads-pvc
  namespace: vitanexa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vitanexa-db-pvc
  namespace: vitanexa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vitanexa-backend-hpa
  namespace: vitanexa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vitanexa-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# Ingress (for production domain)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vitanexa-ingress
  namespace: vitanexa
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: app.vitanexa.ai
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: vitanexa-backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vitanexa-frontend-service
            port:
              number: 80
  tls:
  - hosts:
    - app.vitanexa.ai
    secretName: vitanexa-tls
